
name: Build Oscar Client
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
 
      - name: Build mod
        run: gradle build
 
      - name: Upload artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: oscar-client-${{ github.sha }}
          path: build/libs/oscar-client-*[!sources].jar
          if-no-files-found: warn
 
