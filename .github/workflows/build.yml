name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout toàn bộ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Java 21 (bắt buộc cho MC 1.21.x / Fabric)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # 3. Cache Gradle để build nhanh hơn lần sau
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Build mod (tạo ra file .jar trong build/libs/)
      - name: Build mod
        run: ./gradlew build --no-daemon

      # 6. Upload artifact (file .jar) để tải về
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oscar-client-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
