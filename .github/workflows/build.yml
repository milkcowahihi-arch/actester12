name: Build Oscar Client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04        # fix warning 2: dùng version cụ thể thay vì ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2   # fix warning 1: pin version mới nhất dùng Node.js 20+

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Upload artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: oscar-client-${{ github.sha }}
          path: build/libs/oscar-client-*.jar
          if-no-files-found: warn
