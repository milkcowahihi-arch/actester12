name: Build Oscar Client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Gradle Wrapper manually
        run: |
          mkdir -p gradle/wrapper
          curl -sSL https://services.gradle.org/distributions/gradle-8.8-bin.zip -o gradle-8.8-bin.zip
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradlew -o gradlew
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-8.8-${{ hashFiles('**/*.gradle*') }}

      - name: Build mod
        run: ./gradlew build

      - name: Upload artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: oscar-client-${{ github.sha }}
          path: build/libs/oscar-client-*[!sources].jar
          if-no-files-found: warn
