
name: Build Oscar Client
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ubuntu-24.04
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
 
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper          # dùng version trong gradle-wrapper.properties
 
      - name: Build mod
        run: ./gradlew build --no-daemon
 
      - name: Upload artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: oscar-client-${{ github.sha }}
          path: build/libs/oscar-client-*.jar
          if-no-files-found: warn
 
